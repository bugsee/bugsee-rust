name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    # The platform-specific code IS the product here: the native crash handler
    # is `cfg`-gated per OS, so a single-runner CI compiled and ran barely half
    # of it. Apple and Windows were previously proven only by whatever a
    # developer happened to run locally.
    name: build · test · lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform must not cancel the others — when a change breaks
      # Windows, the macOS and Linux results are exactly what tells you whether
      # it is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; running it three times would only
      # cost minutes and produce three identical answers.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Clippy DOES run everywhere, unlike fmt: lints only see the code the
      # active `cfg` selects, so a warning in the Apple or Windows branches is
      # invisible from Linux.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: build (MSRV 1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --locked forces the committed Cargo.lock: MSRV is only meaningful against
      # the exact dependency graph it was verified with (newer transitive deps can
      # silently raise the floor). Scope is deliberately lib/bin only (no
      # --all-targets): MSRV is a promise about the consumer-facing crates, and
      # dev-deps (proptest, …) may float a higher floor that would give a false
      # MSRV failure unrelated to what downstreams actually compile.
      - name: Build (MSRV)
        run: cargo build --workspace --locked
