name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    # The platform-specific code IS the product here: the native crash handler
    # is `cfg`-gated per OS, so a single-runner CI compiled and ran barely half
    # of it. Apple and Windows were previously proven only by whatever a
    # developer happened to run locally.
    name: build · test · lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform must not cancel the others — when a change breaks
      # Windows, the macOS and Linux results are exactly what tells you whether
      # it is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; running it three times would only
      # cost minutes and produce three identical answers.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Clippy DOES run everywhere, unlike fmt: lints only see the code the
      # active `cfg` selects, so a warning in the Apple or Windows branches is
      # invisible from Linux.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: build (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --locked forces the committed Cargo.lock: MSRV is only meaningful against
      # the exact dependency graph it was verified with (newer transitive deps can
      # silently raise the floor). Scope is deliberately lib/bin only (no
      # --all-targets): MSRV is a promise about the consumer-facing crates, and
      # dev-deps (proptest, …) may float a higher floor that would give a false
      # MSRV failure unrelated to what downstreams actually compile.
      - name: Build (MSRV)
        run: cargo build --workspace --locked

  # The mobile targets have a different libc (bionic) and a different Apple
  # sandbox than their desktop cousins, and the crash handler is cfg'd per
  # platform, so "it builds for Linux/macOS" says nothing about them. These jobs
  # can only compile and lint (no device to run on), which is enough to catch the
  # cfg and API drift that otherwise lands unnoticed. Scope is the crash path
  # (core + native) and the C ABI that ships to apps (ffi).
  android:
    name: build · lint (android aarch64)
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner image ships an NDK; point cc-rs and the linker at its clang.
      - name: Configure NDK toolchain
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Clippy (core, native, ffi)
        run: cargo clippy --target "$TARGET" -p bugsee-core -p bugsee-native -p bugsee-ffi --all-targets -- -D warnings

      # Linking the cdylib proves the whole dependency graph (including the C
      # code in zstd-sys) cross-compiles, which clippy alone does not.
      - name: Build C ABI (cdylib/staticlib)
        run: cargo build --release --target "$TARGET" -p bugsee-ffi

  ios:
    name: build · lint (ios aarch64)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-${{ matrix.target }}

      - name: Clippy (core, native, ffi)
        run: cargo clippy --target ${{ matrix.target }} -p bugsee-core -p bugsee-native -p bugsee-ffi --all-targets -- -D warnings

      - name: Build C ABI (staticlib)
        run: cargo build --release --target ${{ matrix.target }} -p bugsee-ffi
