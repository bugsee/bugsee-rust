language = "C"
header = """/*
 *  bugsee.h
 *  bugsee-ffi
 *
 *  Copyright © 2026 Bugsee. All rights reserved.
 *
 *  GENERATED by cbindgen from crates/bugsee-ffi/src/lib.rs — do not edit by
 *  hand. Regenerate with scripts/ffi-header.sh gen; CI fails if this file and
 *  the Rust source disagree.
 *
 *  C ABI for the Bugsee Rust SDK. Link against libbugsee_ffi (static or dynamic).
 *  Every function is panic-safe: a Rust panic never crosses this boundary — it
 *  is contained and reported as BUGSEE_STATUS_PANIC (bugsee_is_active has no
 *  status to carry it and returns 0 instead).
 */"""
include_guard = "BUGSEE_H"
cpp_compat = true
usize_is_size_t = true
style = "type"
no_includes = true
documentation = true
documentation_style = "c"
sys_includes = ["stdint.h"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[export]
include = ["BugseeStatus"]
