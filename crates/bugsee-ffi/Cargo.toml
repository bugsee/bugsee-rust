[package]
name = "bugsee-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "C ABI for the Bugsee Rust SDK — embed into iOS/Android and other host languages."

[lib]
# staticlib/cdylib for embedding; rlib so Rust integration tests can link it.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bugsee = { path = "../bugsee", version = "0.1.0" }
serde_json = { workspace = true }
