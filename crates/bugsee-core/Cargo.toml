[package]
name = "bugsee-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core capture, persistence, and export engine for the Bugsee Rust SDK (no host-integration deps)."

[dependencies]
bugsee-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
zip = { version = "2", default-features = false, features = ["zstd"] }
sha1 = "0.10.7"

# Unix only: a single contained `kill(pid, 0)` liveness probe used by recovery to
# avoid resurrecting a still-running shared-data-dir peer's session as a "crash".
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bugsee-platform-desktop = { workspace = true }
serde_json = { workspace = true }
proptest = "1"
