[package]
name = "bugsee-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native fatal-crash handler (signal/exception) for the Bugsee Rust SDK — writes a crash marker for next-launch recovery."

[dependencies]
bugsee-core = { workspace = true }

# Windows only. Unix (Linux, Android, macOS) uses the SDK's own signal handler,
# which chains to the host's handlers itself so a fault the host recovers from is
# not reported; every other target gets the stub in `lib.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
crash-handler = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple: fault-safe reads of the crashed thread's stack.
[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.4"

# Linux/Android: the handler runs on the crashing thread, so a signal-safe
# unwinder captures its own stack (handles both x86_64 and aarch64).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
backtrace = "0.3"

# Dev-only: the AUTHORITATIVE implementation of a module's debug identity — the
# same crate `bugsee-cli` uses to key an upload and the worker uses to key the
# symbol store. Present so a test can cross-check what this crate reports at
# crash time against what the pipeline will store, rather than against another
# copy of our own arithmetic.
[dev-dependencies]
# Default features: the granular ones are not actually independent
# (`sourcebundle` is required by `base`/`dwarf` regardless), so pinning a subset
# fails to compile. Dev-only, so the weight costs test builds and nothing shipped.
symbolic-debuginfo = "13"
