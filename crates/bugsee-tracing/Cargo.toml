[package]
name = "bugsee-tracing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "tracing integration for the Bugsee Rust SDK — events become captured log entries."

[dependencies]
bugsee = { path = "../bugsee", version = "0.1.0", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tracing-core = "0.1"
serde_json = { workspace = true }

[dev-dependencies]
bugsee = { path = "../bugsee", version = "0.1.0" }
zip = { version = "2", default-features = false, features = ["zstd"] }
