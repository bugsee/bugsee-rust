[package]
name = "bugsee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bugsee SDK for Rust — crash, panic, and error reporting with backend-compatible report bundles."

[dependencies]
bugsee-core = { workspace = true }
bugsee-panic = { workspace = true, optional = true }
bugsee-native = { workspace = true, optional = true }
serde_json = { workspace = true }
backtrace = "0.3"
ureq = { version = "2", optional = true, features = ["json"] }
sysinfo = { version = "0.33", optional = true, default-features = false, features = ["system", "disk"] }

# Unconditional on unix: the data-directory ownership checks (`options.rs`) call
# `geteuid`, and the `telemetry` feature's local-UTC-offset / hardware-model probes
# (`hostinfo.rs`) call libc too. It is already in the tree via `bugsee-core` /
# `bugsee-native`, so this adds nothing; keeping it non-optional is what lets
# `--no-default-features` build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["zstd"] }

[features]
default = ["net", "panic", "native", "telemetry"]
# The default synchronous HTTP transport (ureq). Disable to inject a custom one.
net = ["dep:ureq"]
# Global Rust panic observer + catch_unwind boundary guards.
panic = ["dep:bugsee-panic"]
# Native fatal-crash handler (POSIX signal / Windows SEH) + next-launch recovery.
native = ["dep:bugsee-native"]
# System/process telemetry sampling (traces.system) via sysinfo.
telemetry = ["dep:sysinfo"]

# The crash matrix needs the REAL main thread: an uncaught panic must unwind out
# of `main`, and the panic observer treats any other thread as "a thread died",
# not "the process died". libtest runs tests on spawned threads, so this target
# supplies its own `main`.
[[test]]
name = "crash_e2e_matrix"
harness = false
required-features = ["native"]

# Same reason: the session-health matrix kills real child processes.
[[test]]
name = "release_health"
harness = false
required-features = ["native"]

# Dies for real after a burst of events; needs its own `main`, like the above.
[[test]]
name = "crash_inflight"
harness = false
required-features = ["native"]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
